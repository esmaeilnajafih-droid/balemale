<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پیام‌رسان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: Tahoma, Arial, sans-serif; }

        :root {
            --primary: #0088cc;
            --primary-dark: #006fa8;
            --primary-light: #e6f4fa;
            --text: #1a1a1a;
            --text-muted: #7d8b99;
        }

        body.auth-page {
            background: #0f172a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* پس‌زمینه تزئینی */
        body.auth-page::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body.auth-page::after {
            content: '';
            position: absolute;
            bottom: -50%; left: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .auth-card {
            background: #fff;
            padding: 40px 32px 32px;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #764ba2, var(--primary));
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .auth-icon {
            width: 72px; height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--primary), #764ba2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 24px rgba(0, 136, 204, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .auth-card h1 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .auth-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .auth-input-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .auth-input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
            pointer-events: none;
        }

        .auth-card input {
            width: 100%;
            padding: 14px 46px 14px 18px;
            border: 2px solid #e4e8ec;
            background: #f8fafc;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            text-align: left;
            direction: ltr;
            color: var(--text);
        }

        .auth-card input:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 136, 204, 0.12);
        }

        .auth-card input::placeholder {
            color: #adb5bd;
        }

        .auth-card button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .auth-card button::after {
            content: '←';
            font-size: 16px;
            transition: transform 0.25s;
        }

        .auth-card button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.45);
        }

        .auth-card button:hover::after {
            transform: translateX(-4px);
        }

        .auth-card button:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(0, 136, 204, 0.35);
        }

        #message-area {
            font-size: 13.5px;
            margin-top: 14px;
            min-height: 20px;
            transition: all 0.2s;
            font-weight: 600;
        }

        #message-area.error { color: #ef4444; }
        #message-area.success { color: #22c55e; }

        .auth-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed #e4e8ec;
            font-size: 12.5px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 22px 24px;
                border-radius: 16px;
            }
            .auth-icon { width: 64px; height: 64px; font-size: 30px; }
            .auth-card h1 { font-size: 21px; }
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-icon">💬</div>
        <h1>پیام‌رسان</h1>
        <p class="auth-subtitle">ایمیل خود را وارد کنید و شروع کنید</p>

        <div class="auth-input-wrap">
            <span class="auth-input-icon">📧</span>
            <input
                type="email"
                id="email-input"
                placeholder="you@example.com"
                autocomplete="off"
                autofocus
            >
        </div>

        <button id="enter-chat-btn">ورود به چت</button>

        <p id="message-area"></p>

        <div class="auth-footer">
            <span>✨ بدون ثبت‌نام، بدون رمز عبور</span>
        </div>
    </div>

    <script>
        const input = document.getElementById('email-input');
        const btn = document.getElementById('enter-chat-btn');
        const messageArea = document.getElementById('message-area');

        const savedEmail = localStorage.getItem('my_email');
        if (savedEmail) {
            window.location.href = 'chat.html';
        }

        function enterChat() {
            const email = input.value.trim().toLowerCase();

            if (!email) {
                messageArea.textContent = '⚠️ لطفاً ایمیل خود را وارد کنید';
                messageArea.className = 'error';
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                messageArea.textContent = '⚠️ فرمت ایمیل درست نیست';
                messageArea.className = 'error';
                return;
            }

            localStorage.setItem('my_email', email);
            messageArea.textContent = '✅ در حال ورود...';
            messageArea.className = 'success';

            setTimeout(() => {
                window.location.href = 'chat.html';
            }, 400);
        }

        btn.addEventListener('click', enterChat);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enterChat();
        });
    </script>
</body>
</html>
