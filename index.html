<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ورود به نکسوم | Nexom</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;font-family:'Vazirmatn',Tahoma,sans-serif}
body.auth-page{background:#05061a;position:fixed;inset:0;display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto}
body.lang-en{direction:ltr}
body.auth-page::before{content:'';position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 70%,#fff,transparent),radial-gradient(1px 1px at 50% 50%,#fff,transparent);background-size:200% 200%;opacity:.6;pointer-events:none;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:.8}}
body.auth-page::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(0,212,255,.25),transparent 45%),radial-gradient(circle at 85% 80%,rgba(123,63,242,.25),transparent 45%);pointer-events:none}
.auth-card{position:relative;background:rgba(15,20,60,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:44px 34px 34px;border-radius:26px;border:1.5px solid rgba(0,212,255,.3);box-shadow:0 25px 80px rgba(0,0,0,.6);width:100%;max-width:440px;margin:auto;text-align:center;z-index:2}
.auth-icon{width:88px;height:88px;margin:0 auto 18px;background:linear-gradient(135deg,#00d4ff,#7b3ff2,#ec4899);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 10px 40px rgba(0,212,255,.5);animation:iconFloat 4s ease-in-out infinite}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.auth-card h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#00d4ff,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.auth-subtitle{font-size:13.5px;color:#8b9dc3;margin-bottom:26px}
.auth-tabs{display:flex;gap:5px;background:rgba(0,0,0,.3);padding:5px;border-radius:14px;margin-bottom:22px;border:1px solid rgba(0,212,255,.2)}
.auth-tab{flex:1;padding:12px 0;border:none;background:transparent;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;color:#8b9dc3;cursor:pointer;transition:all .3s}
.auth-tab.active{background:linear-gradient(135deg,#00d4ff,#7b3ff2);color:#fff;box-shadow:0 4px 20px rgba(0,212,255,.5)}
.auth-input-wrap{position:relative;margin-bottom:14px}
.auth-input-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.8;pointer-events:none;z-index:2}
.auth-card input{width:100%;height:54px;padding:0 50px 0 18px;border:1.5px solid rgba(0,212,255,.2);background:rgba(0,0,0,.25);border-radius:14px;font-size:14.5px;outline:none;font-family:inherit;text-align:left;direction:ltr;color:#fff;line-height:54px}
.auth-card input:focus{background:rgba(0,212,255,.08);border-color:#00d4ff;box-shadow:0 0 0 4px rgba(0,212,255,.15)}
.auth-card input::placeholder{color:#5a6b8a}
.auth-card button.submit-btn{width:100%;height:54px;background:linear-gradient(135deg,#00d4ff,#7b3ff2,#ec4899);color:#fff;border:none;border-radius:14px;font-size:15.5px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 8px 25px rgba(0,212,255,.4);margin-top:10px}
.auth-card button.submit-btn:disabled{opacity:.55;cursor:not-allowed}
#message-area{font-size:13px;margin-top:14px;min-height:22px;font-weight:600}
#message-area.error{color:#ff6b6b}
#message-area.success{color:#4ade80}
.auth-footer{margin-top:26px;padding-top:20px;border-top:1px dashed rgba(0,212,255,.2);font-size:12.5px;color:#8b9dc3;display:flex;align-items:center;justify-content:center;gap:6px}
.auth-footer::before{content:'🔒'}
</style>
</head>
<body class="auth-page lang-fa">
<div class="auth-card">
  <div class="auth-icon">⚡</div>
  <h1>نکسوم</h1>
  <p class="auth-subtitle">وارد شوید یا ثبت‌نام کنید</p>

  <div class="auth-tabs">
    <button class="auth-tab active" id="tab-login">ورود</button>
    <button class="auth-tab" id="tab-signup">ثبت‌نام</button>
  </div>

  <div class="auth-input-wrap">
    <span class="auth-input-icon">📱</span>
    <input type="tel" id="phone-input" placeholder="09xxxxxxxxx" maxlength="11">
  </div>

  <div class="auth-input-wrap">
    <span class="auth-input-icon">🔒</span>
    <input type="password" id="password-input" placeholder="رمز عبور">
  </div>

  <div class="auth-input-wrap" id="username-wrap" style="display:none;">
    <span class="auth-input-icon">@</span>
    <input type="text" id="username-input" placeholder="آیدی (مثلاً: sobhan)" style="direction:ltr; text-align:left;">
  </div>

  <button class="submit-btn" id="submit-btn">ورود</button>
  <p id="message-area"></p>

  <div class="auth-footer">
    <span>امن و رایگان</span>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://sgjrwmnfvrpjtshlabva.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnanJ3bW5mdnJwanRzaGxhYnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTYwNzcsImV4cCI6MjEwNDYzMjA3N30._BOp-ONPTEbaM2mnGdJbdvjN-7qqA87zvannrOv02Eo';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentMode = 'login';
const phoneInput = document.getElementById('phone-input');
const passwordInput = document.getElementById('password-input');
const usernameInput = document.getElementById('username-input');
const submitBtn = document.getElementById('submit-btn');
const messageArea = document.getElementById('message-area');

const savedUser = localStorage.getItem('my_phone');
if (savedUser) { window.location.href = 'chat.html'; }

document.getElementById('tab-login').addEventListener('click', () => {
  currentMode = 'login';
  document.getElementById('tab-login').classList.add('active');
  document.getElementById('tab-signup').classList.remove('active');
  document.getElementById('username-wrap').style.display = 'none';
  submitBtn.textContent = 'ورود';
  messageArea.textContent = '';
});

document.getElementById('tab-signup').addEventListener('click', () => {
  currentMode = 'signup';
  document.getElementById('tab-signup').classList.add('active');
  document.getElementById('tab-login').classList.remove('active');
  document.getElementById('username-wrap').style.display = 'block';
  submitBtn.textContent = 'ثبت‌نام';
  messageArea.textContent = '';
});

submitBtn.addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  const password = passwordInput.value;

  if (!phone) { messageArea.textContent = '⚠️ شماره تلفن را وارد کنید'; messageArea.className = 'error'; return; }
  if (!/^09\d{9}$/.test(phone)) { messageArea.textContent = '⚠️ شماره باید ۱۱ رقم و با ۰۹ شروع شود'; messageArea.className = 'error'; return; }
  if (!password) { messageArea.textContent = '⚠️ رمز عبور را وارد کنید'; messageArea.className = 'error'; return; }
  if (password.length < 6) { messageArea.textContent = '⚠️ رمز باید حداقل ۶ کاراکتر باشد'; messageArea.className = 'error'; return; }

  submitBtn.disabled = true;
  messageArea.textContent = '⏳ صبر کنید...';
  messageArea.className = '';

  try {
    if (currentMode === 'signup') {
      const username = usernameInput.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      if (!username || username.length < 3) {
        messageArea.textContent = '⚠️ آیدی باید حداقل ۳ حرف باشد (فقط حروف انگلیسی، اعداد و _)';
        messageArea.className = 'error';
        submitBtn.disabled = false;
        return;
      }
      const { data: existing } = await supabase.from('my_users').select('id').eq('username', username).maybeSingle();
      if (existing) {
        messageArea.textContent = '❌ این آیدی قبلاً گرفته شده!';
        messageArea.className = 'error';
        submitBtn.disabled = false;
        return;
      }

      const { data: existingPhone } = await supabase.from('my_users').select('id').eq('phone', phone).maybeSingle();
      if (existingPhone) {
        messageArea.textContent = '❌ این شماره قبلاً ثبت‌نام کرده است';
        messageArea.className = 'error';
        submitBtn.disabled = false;
        return;
      }

      const { error } = await supabase.from('my_users').insert({ phone: phone, password: password, username: username });

      if (error) {
        messageArea.textContent = '❌ خطا: ' + error.message;
        messageArea.className = 'error';
        submitBtn.disabled = false;
        return;
      }

      messageArea.textContent = '✅ ثبت‌نام موفق! در حال ورود...';
      messageArea.className = 'success';
      
      setTimeout(() => {
        localStorage.setItem('my_phone', phone);
        window.location.href = 'chat.html';
      }, 1000);

    } else {
      const { data, error } = await supabase.from('my_users').select('*').eq('phone', phone).eq('password', password).maybeSingle();

      if (error || !data) {
        messageArea.textContent = '❌ شماره یا رمز عبور اشتباه است';
        messageArea.className = 'error';
        submitBtn.disabled = false;
        return;
      }

      messageArea.textContent = '✅ در حال ورود...';
      messageArea.className = 'success';
      
      setTimeout(() => {
        localStorage.setItem('my_phone', phone);
        window.location.href = 'chat.html';
      }, 500);
    }
  } catch (err) {
    messageArea.textContent = '❌ ' + err.message;
    messageArea.className = 'error';
    submitBtn.disabled = false;
  }
});

passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitBtn.click(); });
</script>
</body>
</html>
