<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: Tahoma, Arial, sans-serif; }

        body.chat-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 10px;
        }

        .app {
            width: 100%; max-width: 1100px; height: 95vh; max-height: 900px;
            background: #fff; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex; overflow: hidden;
        }

        /* ===== ستون کناری ===== */
        .sidebar {
            width: 320px; background: #f8f9fa;
            border-left: 1px solid #e0e0e0;
            display: flex; flex-direction: column;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #0088cc 0%, #006fa8 100%);
            color: white; padding: 18px;
        }

        .sidebar-header h2 { font-size: 16px; margin-bottom: 6px; }

        .my-email {
            font-size: 11.5px; opacity: 0.9;
            direction: ltr; text-align: left; word-break: break-all;
        }

        .logout-btn {
            margin-top: 10px; width: 100%; padding: 8px;
            background: rgba(255, 255, 255, 0.2); color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-family: inherit; font-size: 12px;
        }

        .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .action-buttons {
            display: flex; gap: 6px; padding: 12px;
            background: #fff; border-bottom: 1px solid #e0e0e0;
        }

        .action-btn {
            flex: 1; padding: 8px 6px; background: #fff;
            border: 2px dashed #0088cc; color: #0088cc;
            border-radius: 10px; cursor: pointer;
            font-family: inherit; font-size: 11.5px;
            font-weight: 600; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }

        .action-btn:hover { background: #e6f4fa; }
        .action-btn .icon { font-size: 16px; }

        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; }

        .tab {
            flex: 1; padding: 12px; text-align: center;
            font-size: 13px; color: #667781; cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s; font-weight: 600;
        }

        .tab.active { color: #0088cc; border-bottom-color: #0088cc; }
        .tab:hover { background: #f8f9fa; }

        .list-container { flex: 1; overflow-y: auto; padding: 10px; }

        .list-container::-webkit-scrollbar { width: 5px; }
        .list-container::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15); border-radius: 3px;
        }

        .list-item {
            padding: 12px 14px; background: #fff; border-radius: 12px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 10px;
            border: 2px solid transparent;
        }

        .list-item:hover { background: #e6f4fa; }
        .list-item.active { background: #e6f4fa; border-color: #0088cc; }

        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 600; flex-shrink: 0; color: white;
        }

        .avatar.private { background: linear-gradient(135deg, #0088cc, #764ba2); }
        .avatar.group { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .avatar.channel { background: linear-gradient(135deg, #f97316, #ea580c); }

        .item-info { flex: 1; min-width: 0; }

        .item-name {
            font-size: 13.5px; color: #1a1a1a;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; font-weight: 600;
        }

        .item-sub {
            font-size: 11px; color: #667781;
            direction: ltr; text-align: right;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; margin-top: 2px;
        }

        .item-badge {
            font-size: 9px; padding: 2px 6px;
            border-radius: 8px; font-weight: 700; flex-shrink: 0;
        }

        .badge-group { background: #d1fae5; color: #065f46; }
        .badge-channel { background: #fed7aa; color: #9a3412; }

        .empty-list {
            text-align: center; color: #adb5bd; font-size: 13px;
            padding: 40px 20px; line-height: 1.8;
        }

        /* ===== ناحیه چت ===== */
        .chat-area {
            flex: 1; display: flex; flex-direction: column;
            background: #e5ddd5;
        }

        .chat-header {
            background: #fff; padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex; align-items: center; gap: 10px;
        }

        .chat-header .avatar { width: 42px; height: 42px; }
        .chat-header-info { flex: 1; min-width: 0; }

        .chat-header-name {
            font-size: 15px; font-weight: 600; color: #1a1a1a;
        }

        .chat-header-sub {
            font-size: 11.5px; color: #667781;
            direction: ltr; text-align: right;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-notice {
            background: #fef3c7; color: #92400e;
            padding: 10px 20px; font-size: 12.5px;
            text-align: center; border-bottom: 1px solid #fde68a;
        }

        .no-chat-selected {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #667781; font-size: 14px;
            text-align: center; padding: 20px; gap: 10px;
        }

        .no-chat-selected .big-icon { font-size: 60px; opacity: 0.5; }

        #messages-list {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        #messages-list::-webkit-scrollbar { width: 6px; }
        #messages-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2); border-radius: 3px;
        }

        .message-item {
            max-width: 70%; padding: 10px 14px; background: #fff;
            border-radius: 16px 16px 16px 4px; align-self: flex-start;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            word-wrap: break-word; animation: slideIn 0.3s ease-out;
        }

        .message-item.my-message {
            background: #d9fdd3; align-self: flex-end;
            border-radius: 16px 16px 4px 16px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-sender {
            font-size: 11.5px; font-weight: 700; color: #0088cc;
            margin-bottom: 3px; direction: ltr; text-align: right;
        }

        .msg-content {
            font-size: 14.5px; color: #1a1a1a;
            line-height: 1.5; word-break: break-word;
        }

        /* ===== پیام صوتی ===== */
        .voice-message {
            display: flex; align-items: center; gap: 10px;
            min-width: 220px;
        }

        .voice-play-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: #0088cc; color: white;
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
            transition: all 0.2s;
        }

        .voice-play-btn:hover { transform: scale(1.08); }
        .voice-play-btn.playing { background: #ef4444; }

        .voice-wave {
            flex: 1; height: 30px;
            display: flex; align-items: center; gap: 2px;
        }

        .voice-wave span {
            width: 3px; background: #0088cc;
            border-radius: 2px; opacity: 0.6;
        }

        .voice-duration {
            font-size: 12px; color: #667781;
            direction: ltr; flex-shrink: 0;
        }

        /* ===== ناحیه ورودی ===== */
        .message-input-area {
            display: flex; padding: 14px 20px; background: #fff;
            border-top: 1px solid #e0e0e0; gap: 10px; align-items: center;
        }

        .message-input-area input {
            flex: 1; padding: 12px 20px; border: 2px solid transparent;
            background: #f0f2f5; border-radius: 24px; font-size: 14.5px;
            outline: none; font-family: inherit;
        }

        .message-input-area input:focus {
            background: #fff; border-color: #0088cc;
        }

        .message-input-area input:disabled {
            background: #f8f9fa; cursor: not-allowed;
        }

        .mic-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #0088cc 0%, #006fa8 100%);
            color: white; border: none; cursor: pointer;
            font-size: 18px; flex-shrink: 0;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }

        .mic-btn:hover { transform: scale(1.05); }
        .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .mic-btn.recording {
            background: #ef4444;
            animation: pulse-record 1s infinite;
        }

        @keyframes pulse-record {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
        }

        .send-btn {
            padding: 12px 22px;
            background: linear-gradient(135deg, #0088cc 0%, #006fa8 100%);
            color: white; border: none; border-radius: 24px;
            cursor: pointer; font-size: 14.5px;
            font-weight: 600; font-family: inherit;
            flex-shrink: 0;
        }

        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== نوار ضبط ===== */
        .recording-bar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #fef2f2;
            border-top: 1px solid #fecaca;
        }

        .recording-bar.show { display: flex; }

        .recording-dot {
            width: 12px; height: 12px; background: #ef4444;
            border-radius: 50%; animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .recording-time {
            font-size: 14px; font-weight: 700; color: #ef4444;
            direction: ltr;
        }

        .recording-text {
            flex: 1; font-size: 13px; color: #991b1b;
        }

        .recording-actions { display: flex; gap: 8px; }

        .rec-btn {
            padding: 8px 16px; border: none; border-radius: 20px;
            cursor: pointer; font-family: inherit;
            font-size: 13px; font-weight: 600;
        }

        .rec-cancel { background: #f0f2f5; color: #667781; }
        .rec-send { background: #22c55e; color: white; }

        /* ===== مودال ===== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: none;
            justify-content: center; align-items: center;
            z-index: 1000; padding: 20px; overflow-y: auto;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: #fff; padding: 28px; border-radius: 20px;
            width: 100%; max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 90vh; overflow-y: auto;
        }

        .modal h3 { font-size: 18px; color: #1a1a1a; margin-bottom: 8px; }
        .modal p { font-size: 13px; color: #667781; margin-bottom: 18px; }

        .modal label {
            display: block; font-size: 13px; color: #4b5563;
            margin-bottom: 6px; font-weight: 600;
        }

        .modal input, .modal textarea {
            width: 100%; padding: 12px 16px;
            border: 2px solid #e0e0e0; background: #f8f9fa;
            border-radius: 12px; font-size: 14.5px;
            outline: none; font-family: inherit;
            margin-bottom: 14px;
        }

        .modal input:focus, .modal textarea:focus {
            background: #fff; border-color: #0088cc;
        }

        .modal textarea { resize: vertical; min-height: 70px; }

        .type-selector { display: flex; gap: 8px; margin-bottom: 14px; }

        .type-option {
            flex: 1; padding: 12px; background: #f8f9fa;
            border: 2px solid #e0e0e0; border-radius: 12px;
            text-align: center; cursor: pointer;
            transition: all 0.2s; font-size: 13px;
            font-weight: 600; color: #667781;
        }

        .type-option:hover { background: #e6f4fa; }
        .type-option.active {
            background: #e6f4fa; border-color: #0088cc; color: #0088cc;
        }

        .type-option .icon { font-size: 20px; display: block; margin-bottom: 4px; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 8px; }

        .modal-buttons button {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-family: inherit; font-size: 14px;
            font-weight: 600; cursor: pointer;
        }

        .btn-cancel { background: #f0f2f5; color: #667781; }
        .btn-primary {
            background: linear-gradient(135deg, #0088cc 0%, #006fa8 100%);
            color: white;
        }

        .back-btn {
            display: none; background: transparent; border: none;
            font-size: 20px; cursor: pointer; color: #0088cc; padding: 0 8px;
        }

        @media (max-width: 700px) {
            body { padding: 0; }
            .app { height: 100vh; max-height: 100vh; border-radius: 0; position: relative; }
            .sidebar {
                position: absolute; top: 0; left: 0; bottom: 0;
                width: 100%; z-index: 10; transition: transform 0.3s;
            }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; }
            .message-item { max-width: 85%; }
            .back-btn { display: flex; }
        }
    </style>
</head>
<body class="chat-page">
    <div class="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>💬 پیام‌رسان</h2>
                <div class="my-email" id="my-email-display"></div>
                <button class="logout-btn" id="logout-btn">خروج</button>
            </div>

            <div class="action-buttons">
                <button class="action-btn" id="new-contact-btn">
                    <span class="icon">👤</span> مخاطب
                </button>
                <button class="action-btn" id="new-group-btn">
                    <span class="icon">👥</span> گروه
                </button>
                <button class="action-btn" id="new-channel-btn">
                    <span class="icon">📢</span> کانال
                </button>
            </div>

            <div class="tabs">
                <div class="tab active" data-tab="private">خصوصی</div>
                <div class="tab" data-tab="group">گروه‌ها</div>
                <div class="tab" data-tab="channel">کانال‌ها</div>
            </div>

            <div class="list-container" id="list-container"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chat-header" style="display:none;">
                <button class="back-btn" id="back-btn">→</button>
                <div class="avatar" id="chat-header-avatar"></div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chat-header-name"></div>
                    <div class="chat-header-sub" id="chat-header-sub"></div>
                </div>
            </div>

            <div class="channel-notice" id="channel-notice" style="display:none;">
                📢 فقط ادمین‌ها می‌توانند پیام بفرستند
            </div>

            <div class="no-chat-selected" id="no-chat-selected">
                <div class="big-icon">💬</div>
                <div>یک چت را انتخاب کن یا چت جدید بساز</div>
            </div>

            <div id="messages-list" style="display:none;"></div>

            <div class="message-input-area" id="message-input-area" style="display:none;">
                <input type="text" id="message-input" placeholder="پیام خود را بنویسید...">
                <button class="mic-btn" id="mic-btn" title="ضبط ویس">🎤</button>
                <button class="send-btn" id="send-message-btn">ارسال</button>
            </div>

            <div class="recording-bar" id="recording-bar">
                <div class="recording-dot"></div>
                <div class="recording-time" id="recording-time">0:00</div>
                <div class="recording-text">در حال ضبط...</div>
                <div class="recording-actions">
                    <button class="rec-btn rec-cancel" id="rec-cancel">لغو</button>
                    <button class="rec-btn rec-send" id="rec-send">ارسال</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="contact-modal">
        <div class="modal">
            <h3>👤 مخاطب جدید</h3>
            <p>ایمیل مخاطب را وارد کن</p>
            <input type="email" id="new-contact-email" placeholder="friend@example.com">
            <div class="modal-buttons">
                <button class="btn-cancel" data-close>انصراف</button>
                <button class="btn-primary" id="contact-add">افزودن</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="group-modal">
        <div class="modal">
            <h3 id="group-modal-title">👥 گروه جدید</h3>
            <p>اطلاعات را وارد کن</p>

            <label>نوع</label>
            <div class="type-selector">
                <div class="type-option active" data-type="group">
                    <span class="icon">👥</span> گروه
                </div>
                <div class="type-option" data-type="channel">
                    <span class="icon">📢</span> کانال
                </div>
            </div>

            <label>نام</label>
            <input type="text" id="group-name" placeholder="مثلاً: گروه دوستان">

            <label>توضیحات (اختیاری)</label>
            <textarea id="group-desc" placeholder="توضیح کوتاه..."></textarea>

            <label>ایمیل اعضا (با کاما جدا کن)</label>
            <textarea id="group-members" placeholder="ali@test.com, sara@test.com"></textarea>

            <div class="modal-buttons">
                <button class="btn-cancel" data-close>انصراف</button>
                <button class="btn-primary" id="group-create">ساخت</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL = 'https://mjmzpbhflctxrkrkzebw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbXpwYmhmbGN0eHJrcmt6ZWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA3ODAsImV4cCI6MjEwNDU0Njc4MH0.AtV8I1RsdPG_I7hIMNlM489wjse6k4Jz0pEfRbQpYY4';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const myEmail = localStorage.getItem('my_email');
        if (!myEmail) window.location.href = 'index.html';
        document.getElementById('my-email-display').textContent = myEmail;

        let currentTab = 'private';
        let currentChat = null;
        let realtimeChannel = null;
        let selectedGroupType = 'group';

        // ===== ضبط صدا =====
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingStartTime = null;
        let recordingTimer = null;
        let currentAudio = null;

        const listContainer = document.getElementById('list-container');
        const messagesList = document.getElementById('messages-list');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-message-btn');
        const micBtn = document.getElementById('mic-btn');
        const chatHeader = document.getElementById('chat-header');
        const chatHeaderName = document.getElementById('chat-header-name');
        const chatHeaderSub = document.getElementById('chat-header-sub');
        const chatHeaderAvatar = document.getElementById('chat-header-avatar');
        const noChatSelected = document.getElementById('no-chat-selected');
        const messageInputArea = document.getElementById('message-input-area');
        const channelNotice = document.getElementById('channel-notice');
        const sidebar = document.getElementById('sidebar');
        const recordingBar = document.getElementById('recording-bar');
        const recordingTime = document.getElementById('recording-time');

        // ===== توابع کمکی =====
        const escapeHtml = (text) => {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        };

        const getInitial = (str) => (str || '?').charAt(0).toUpperCase();

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        // ===== تب‌ها =====
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderList();
            });
        });

        const renderList = async () => {
            listContainer.innerHTML = '<div class="empty-list">در حال بارگذاری...</div>';
            if (currentTab === 'private') await renderPrivateList();
            else await renderGroupChannelList(currentTab);
        };

        const renderPrivateList = async () => {
            const { data, error } = await supabase
                .from('messages')
                .select('sender_email, receiver_email')
                .is('chat_id', null)
                .or(`sender_email.eq.${myEmail},receiver_email.eq.${myEmail}`);

            if (error) {
                listContainer.innerHTML = '<div class="empty-list">خطا در بارگذاری</div>';
                return;
            }

            const contactsSet = new Set();
            data.forEach(msg => {
                if (msg.sender_email !== myEmail) contactsSet.add(msg.sender_email);
                if (msg.receiver_email !== myEmail) contactsSet.add(msg.receiver_email);
            });

            const contacts = Array.from(contactsSet);

            if (contacts.length === 0) {
                listContainer.innerHTML = '<div class="empty-list">هنوز مخاطبی نداری.<br>روی «مخاطب» بزن.</div>';
                return;
            }

            listContainer.innerHTML = '';
            contacts.forEach(email => {
                const item = document.createElement('div');
                item.className = 'list-item';
                if (currentChat?.type === 'private' && currentChat.email === email) {
                    item.classList.add('active');
                }
                item.innerHTML = `
                    <div class="avatar private">${getInitial(email)}</div>
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(email.split('@')[0])}</div>
                        <div class="item-sub">${escapeHtml(email)}</div>
                    </div>
                `;
                item.addEventListener('click', () => openPrivateChat(email));
                listContainer.appendChild(item);
            });
        };

        const renderGroupChannelList = async (type) => {
            const { data: memberships } = await supabase
                .from('chat_members')
                .select('chat_id')
                .eq('member_email', myEmail);

            if (!memberships || memberships.length === 0) {
                listContainer.innerHTML = `<div class="empty-list">هنوز ${type === 'group' ? 'گروهی' : 'کانالی'} نداری.<br>روی دکمه بالا بزن.</div>`;
                return;
            }

            const chatIds = memberships.map(m => m.chat_id);

            const { data: chats } = await supabase
                .from('chats')
                .select('*')
                .in('id', chatIds)
                .eq('type', type)
                .order('created_at', { ascending: false });

            if (!chats || chats.length === 0) {
                listContainer.innerHTML = `<div class="empty-list">هنوز ${type === 'group' ? 'گروهی' : 'کانالی'} نداری.</div>`;
                return;
            }

            listContainer.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'list-item';
                if (currentChat?.type === type && currentChat.id === chat.id) {
                    item.classList.add('active');
                }
                const badge = type === 'group' 
                    ? '<span class="item-badge badge-group">گروه</span>'
                    : '<span class="item-badge badge-channel">کانال</span>';
                item.innerHTML = `
                    <div class="avatar ${type}">${type === 'group' ? '👥' : '📢'}</div>
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(chat.name)}</div>
                        <div class="item-sub">${escapeHtml(chat.description || 'بدون توضیحات')}</div>
                    </div>
                    ${badge}
                `;
                item.addEventListener('click', () => openGroupChat(chat));
                listContainer.appendChild(item);
            });
        };

        const openPrivateChat = async (email) => {
            stopRecording(true);
            currentChat = { type: 'private', email, name: email.split('@')[0] };

            chatHeader.style.display = 'flex';
            noChatSelected.style.display = 'none';
            messagesList.style.display = 'flex';
            messageInputArea.style.display = 'flex';
            channelNotice.style.display = 'none';

            chatHeaderName.textContent = email.split('@')[0];
            chatHeaderSub.textContent = email;
            chatHeaderAvatar.textContent = getInitial(email);
            chatHeaderAvatar.className = 'avatar private';

            messageInput.disabled = false;
            sendBtn.disabled = false;
            micBtn.disabled = false;
            messageInput.placeholder = 'پیام خود را بنویسید...';

            if (window.innerWidth <= 700) sidebar.classList.add('hidden');

            await loadPrivateMessages();
            setupRealtime();
            messageInput.focus();
            await renderList();
        };

        const openGroupChat = async (chat) => {
            stopRecording(true);
            const { data: memberData } = await supabase
                .from('chat_members')
                .select('role')
                .eq('chat_id', chat.id)
                .eq('member_email', myEmail)
                .single();

            const isOwner = memberData?.role === 'owner' || memberData?.role === 'admin';
            const isChannel = chat.type === 'channel';
            const canSend = chat.type === 'group' || isOwner;

            currentChat = {
                type: chat.type, id: chat.id, name: chat.name,
                description: chat.description, canSend, isOwner
            };

            chatHeader.style.display = 'flex';
            noChatSelected.style.display = 'none';
            messagesList.style.display = 'flex';
            messageInputArea.style.display = 'flex';

            chatHeaderName.textContent = chat.name;
            chatHeaderSub.textContent = chat.description || (isChannel ? 'کانال' : 'گروه');
            chatHeaderAvatar.textContent = isChannel ? '📢' : '👥';
            chatHeaderAvatar.className = 'avatar ' + chat.type;

            if (isChannel && !isOwner) {
                channelNotice.style.display = 'block';
                messageInput.disabled = true;
                sendBtn.disabled = true;
                micBtn.disabled = true;
                messageInput.placeholder = 'فقط ادمین‌ها می‌توانند پیام بفرستند';
            } else {
                channelNotice.style.display = 'none';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                micBtn.disabled = false;
                messageInput.placeholder = 'پیام خود را بنویسید...';
            }

            if (window.innerWidth <= 700) sidebar.classList.add('hidden');

            await loadGroupMessages();
            setupRealtime();
            if (canSend) messageInput.focus();
            await renderList();
        };

        const loadPrivateMessages = async () => {
            if (!currentChat || currentChat.type !== 'private') return;
            const email = currentChat.email;

            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .is('chat_id', null)
                .or(
                    `and(sender_email.eq.${myEmail},receiver_email.eq.${email}),` +
                    `and(sender_email.eq.${email},receiver_email.eq.${myEmail})`
                )
                .order('created_at', { ascending: true });

            if (error) { console.error(error); return; }
            messagesList.innerHTML = '';
            data.forEach(msg => addMessage(msg, false));
        };

        const loadGroupMessages = async () => {
            if (!currentChat || !currentChat.id) return;

            const { data, error } = await supabase
                .from('messages')
                .select('*')
                .eq('chat_id', currentChat.id)
                .order('created_at', { ascending: true });

            if (error) { console.error(error); return; }
            messagesList.innerHTML = '';
            data.forEach(msg => addMessage(msg, true));
        };

        const addMessage = (msg, showSender) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-item';
            if (msg.sender_email === myEmail) msgDiv.classList.add('my-message');

            let html = '';
            if (showSender && msg.sender_email !== myEmail) {
                html += `<div class="msg-sender">${escapeHtml(msg.sender_email)}</div>`;
            }

            if (msg.message_type === 'voice' && msg.audio_url) {
                const duration = msg.audio_duration || 0;
                html += `
                    <div class="voice-message">
                        <button class="voice-play-btn" data-url="${escapeHtml(msg.audio_url)}">▶</button>
                        <div class="voice-wave">
                            ${Array.from({length: 20}, () => `<span style="height:${Math.random()*20+8}px"></span>`).join('')}
                        </div>
                        <div class="voice-duration">${formatTime(duration)}</div>
                    </div>
                `;
            } else {
                html += `<div class="msg-content">${escapeHtml(msg.content || '')}</div>`;
            }

            msgDiv.innerHTML = html;
            messagesList.appendChild(msgDiv);
            messagesList.scrollTop = messagesList.scrollHeight;
        };

        // ===== پخش صوت (Event Delegation) =====
        messagesList.addEventListener('click', (e) => {
            const playBtn = e.target.closest('.voice-play-btn');
            if (!playBtn) return;

            const url = playBtn.dataset.url;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                document.querySelectorAll('.voice-play-btn').forEach(b => {
                    b.textContent = '▶';
                    b.classList.remove('playing');
                });
            }

            if (playBtn.classList.contains('playing')) {
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
                return;
            }

            currentAudio = new Audio(url);
            currentAudio.play();
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing');

            currentAudio.addEventListener('ended', () => {
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
                currentAudio = null;
            });
        });

        const setupRealtime = () => {
            if (realtimeChannel) supabase.removeChannel(realtimeChannel);

            realtimeChannel = supabase
                .channel('chat-' + (currentChat.id || currentChat.email))
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'messages' },
                    (payload) => {
                        const msg = payload.new;
                        if (currentChat.type === 'private') {
                            const relevant =
                                (msg.sender_email === myEmail && msg.receiver_email === currentChat.email) ||
                                (msg.sender_email === currentChat.email && msg.receiver_email === myEmail);
                            if (relevant && !msg.chat_id) addMessage(msg, false);
                        } else {
                            if (msg.chat_id === currentChat.id) addMessage(msg, true);
                        }
                    })
                .subscribe();
        };

        // ===== ارسال پیام متنی =====
        const sendMessage = async () => {
            const content = messageInput.value.trim();
            if (!content || !currentChat) return;

            let payload;
            if (currentChat.type === 'private') {
                payload = {
                    content, sender_email: myEmail, receiver_email: currentChat.email,
                    message_type: 'text'
                };
            } else {
                if (!currentChat.canSend) return;
                payload = {
                    content, sender_email: myEmail, receiver_email: '', chat_id: currentChat.id,
                    message_type: 'text'
                };
            }

            const { error } = await supabase.from('messages').insert(payload);
            if (error) { console.error(error); alert('خطا: ' + error.message); }
            else { messageInput.value = ''; messageInput.focus(); }
        };

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ===== ضبط صدا =====
        const startRecording = async () => {
            if (!currentChat) return;
            if (currentChat.type === 'channel' && !currentChat.isOwner) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();

                micBtn.classList.add('recording');
                micBtn.textContent = '⏹';
                recordingBar.classList.add('show');
                messageInputArea.style.display = 'none';

                recordingTime.textContent = '0:00';
                recordingTimer = setInterval(() => {
                    const sec = Math.floor((Date.now() - recordingStartTime) / 1000);
                    recordingTime.textContent = formatTime(sec);
                    if (sec >= 60) stopRecording(false);
                }, 500);

            } catch (err) {
                alert('دسترسی به میکروفون داده نشد: ' + err.message);
                console.error(err);
            }
        };

        const stopRecording = (cancel) => {
            if (!mediaRecorder) return;

            if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }

            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }

            micBtn.classList.remove('recording');
            micBtn.textContent = '🎤';
            recordingBar.classList.remove('show');
            messageInputArea.style.display = 'flex';

            if (cancel) {
                audioChunks = [];
                mediaRecorder = null;
                recordingStartTime = null;
            }
        };

        micBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording(false);
            } else {
                startRecording();
            }
        });

        document.getElementById('rec-cancel').addEventListener('click', () => {
            stopRecording(true);
        });

        document.getElementById('rec-send').addEventListener('click', async () => {
            const duration = Math.floor((Date.now() - recordingStartTime) / 1000);
            stopRecording(false);

            // کمی صبر تا onstop کامل شود
            setTimeout(async () => {
                if (audioChunks.length === 0) return;

                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                audioChunks = [];
                mediaRecorder = null;

                const fileName = `${myEmail.replace(/[^a-z0-9]/gi, '_')}-${Date.now()}.webm`;

                const { error: uploadError } = await supabase.storage
                    .from('voice-messages')
                    .upload(fileName, audioBlob, { contentType: 'audio/webm' });

                if (uploadError) {
                    alert('خطا در آپلود: ' + uploadError.message);
                    console.error(uploadError);
                    return;
                }

                const { data: urlData } = supabase.storage
                    .from('voice-messages')
                    .getPublicUrl(fileName);

                const audioUrl = urlData.publicUrl;

                let payload;
                if (currentChat.type === 'private') {
                    payload = {
                        content: '', sender_email: myEmail, receiver_email: currentChat.email,
                        message_type: 'voice', audio_url: audioUrl, audio_duration: duration
                    };
                } else {
                    payload = {
                        content: '', sender_email: myEmail, receiver_email: '', chat_id: currentChat.id,
                        message_type: 'voice', audio_url: audioUrl, audio_duration: duration
                    };
                }

                const { error: insertError } = await supabase.from('messages').insert(payload);
                if (insertError) {
                    alert('خطا در ارسال: ' + insertError.message);
                    console.error(insertError);
                }
            }, 200);
        });

        // ===== مودال مخاطب =====
        const contactModal = document.getElementById('contact-modal');
        const newContactEmail = document.getElementById('new-contact-email');

        document.getElementById('new-contact-btn').addEventListener('click', () => {
            contactModal.classList.add('show');
            newContactEmail.value = '';
            newContactEmail.focus();
        });

        document.getElementById('contact-add').addEventListener('click', async () => {
            const email = newContactEmail.value.trim().toLowerCase();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) { alert('ایمیل معتبر نیست'); return; }
            if (email === myEmail) { alert('نمی‌توانی با خودت چت کنی!'); return; }

            contactModal.classList.remove('show');
            await renderList();
            await openPrivateChat(email);
        });

        // ===== مودال گروه/کانال =====
        const groupModal = document.getElementById('group-modal');
        const groupName = document.getElementById('group-name');
        const groupDesc = document.getElementById('group-desc');
        const groupMembers = document.getElementById('group-members');
        const groupModalTitle = document.getElementById('group-modal-title');

        const openGroupModal = (type) => {
            selectedGroupType = type;
            groupModal.classList.add('show');
            groupName.value = '';
            groupDesc.value = '';
            groupMembers.value = '';
            groupModalTitle.textContent = type === 'group' ? '👥 گروه جدید' : '📢 کانال جدید';

            document.querySelectorAll('.type-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.type === type);
            });

            groupName.focus();
        };

        document.getElementById('new-group-btn').addEventListener('click', () => openGroupModal('group'));
        document.getElementById('new-channel-btn').addEventListener('click', () => openGroupModal('channel'));

        document.querySelectorAll('.type-option').forEach(opt => {
            opt.addEventListener('click', () => {
                document.querySelectorAll('.type-option').forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedGroupType = opt.dataset.type;
                groupModalTitle.textContent = selectedGroupType === 'group' ? '👥 گروه جدید' : '📢 کانال جدید';
            });
        });

        document.getElementById('group-create').addEventListener('click', async () => {
            const name = groupName.value.trim();
            const desc = groupDesc.value.trim();
            const membersRaw = groupMembers.value.trim();

            if (!name) { alert('نام را وارد کن'); return; }

            const members = membersRaw
                .split(',')
                .map(e => e.trim().toLowerCase())
                .filter(e => e && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e));

            const { data: chatData, error: chatError } = await supabase
                .from('chats')
                .insert({
                    name, description: desc,
                    type: selectedGroupType,
                    owner_email: myEmail,
                })
                .select()
                .single();

            if (chatError) {
                alert('خطا در ساخت: ' + chatError.message);
                console.error(chatError);
                return;
            }

            const chatId = chatData.id;

            const allMembers = [
                { chat_id: chatId, member_email: myEmail, role: 'owner' },
                ...members
                    .filter(e => e !== myEmail)
                    .map(e => ({ chat_id: chatId, member_email: e, role: 'member' }))
            ];

            const { error: memError } = await supabase
                .from('chat_members')
                .insert(allMembers);

            if (memError) {
                alert('خطا در افزودن اعضا: ' + memError.message);
                console.error(memError);
                return;
            }

            groupModal.classList.remove('show');

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            const targetTab = document.querySelector(`.tab[data-tab="${selectedGroupType}"]`);
            targetTab.classList.add('active');
            currentTab = selectedGroupType;

            await renderList();
            await openGroupChat(chatData);
        });

        // ===== بستن مودال‌ها =====
        document.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.closest('.modal-overlay').classList.remove('show');
            });
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('show');
            });
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            sidebar.classList.remove('hidden');
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('my_email');
            window.location.href = 'index.html';
        });

        await renderList();
    </script>
</body>
</html>
